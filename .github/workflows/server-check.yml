# Checks that the deploy secrets reach the vServer and that the server is prepared
# (folder, Docker access, proxy network). Deploys nothing.
name: Server check

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/server-check.yml]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEST: ${{ secrets.DEPLOY_PATH }}
        run: |
          for v in HOST USER KEY DEST; do
            if [ -z "${!v}" ]; then echo "::error::Secret for $v is missing"; missing=1; else echo "$v is set"; fi
          done
          [ -z "$missing" ]
      - name: Set up SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Check server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEST: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" "
            set -e
            echo \"login: \$(whoami)@\$(hostname)\"
            ls -ld '$DEST'
            touch '$DEST/.write-test' && rm '$DEST/.write-test' && echo 'folder writable'
            docker version --format 'docker {{.Server.Version}}'
            docker network inspect uhrturm-proxy --format 'network {{.Name}}: {{range .Containers}}{{.Name}} {{end}}'
          "
